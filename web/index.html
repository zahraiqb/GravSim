<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gravsim – N-body gravity simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>

    <aside id="panel">
      <h1>gravsim</h1>
      <p id="status">Loading physics core…</p>

      <label>Scenario <select id="scenario"></select></label>
      <p id="desc"></p>

      <label>Integrator
        <select id="method">
          <option value="0">Euler (1st order)</option>
          <option value="1">RK4 (4th order)</option>
          <option value="2">Leapfrog (2nd, symplectic)</option>
          <option value="3">Yoshida (4th, symplectic)</option>
          <option value="4">Dormand–Prince 5(4) adaptive</option>
        </select>
      </label>
      <label>Time step <output id="dtOut"></output>
        <input id="dt" type="range" min="-2" max="1" step="0.05" value="0" />
      </label>
      <label>Speed <output id="warpOut"></output>
        <input id="warp" type="range" min="-3" max="3" step="0.05" value="0" />
      </label>
      <label class="row"><input id="pn" type="checkbox" /> 1PN relativistic corrections</label>
      <label class="row"><input id="trails" type="checkbox" checked /> Trails</label>
      <label class="row"><input id="labelsOn" type="checkbox" checked /> Labels</label>
      <label>Follow <select id="follow"></select></label>

      <div class="buttons">
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
      </div>

      <table id="diag">
        <tr><td>Time</td><td id="dTime"></td></tr>
        <tr><td>ΔE / E₀</td><td id="dE"></td></tr>
        <tr><td>Δ|L| / L₀</td><td id="dL"></td></tr>
        <tr><td>Force evals</td><td id="dEv"></td></tr>
      </table>
      <p class="note" id="limited"></p>
      <p class="note">
        Newtonian N-body + optional 1PN (EIH). Energy drift is the honest test of an integrator:
        try Euler vs. Yoshida. <a href="https://github.com/" id="repo">Source &amp; math on GitHub</a>.
      </p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
